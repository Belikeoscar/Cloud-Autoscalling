apiVersion: v1
kind: Pod
metadata:
  name: k6-run
spec:
  restartPolicy: Never
  containers:
  - name: k6
    image: grafana/k6:0.54.0
    args: ["run", "/scripts/loadtest.js"]
    volumeMounts:
    - name: script
      mountPath: /scripts
  volumes:
  - name: script
    configMap:
      name: k6-script
