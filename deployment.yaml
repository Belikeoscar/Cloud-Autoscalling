apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaling-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaling-app
  template:
    metadata:
      labels:
        app: scaling-app
    spec:
      containers:
      - name: scaling-app
        image: scaling-app:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scaling-app
  labels:
    app: scaling-app
spec:
  selector:
    app: scaling-app
  ports:
  - name: http
    port: 80
    targetPort: 8000
